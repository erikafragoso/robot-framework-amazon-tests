robot:
  # Configurações gerais
  outputdir: results
  timestampoutputs: true
  loglevel: INFO
  
  # Configurações de execução
  include:
    - smoke
    - regressao
  
  # Configurações de ambiente
  variables:
    ENVIRONMENT: dev
    BROWSER: chrome
    TIMEOUT: 10s
  
  # Configurações de relatório
  report: results/report.html
  log: results/log.html
  output: results/output.xml 