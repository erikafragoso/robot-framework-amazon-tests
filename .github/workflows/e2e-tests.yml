name: E2E Testes - Robot Framework

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para os testes (dev/hom/prod)'
        required: false
        default: 'dev'
      test_path:
        description: 'Caminho/padrão dos testes Robot a executar'
        required: false
        default: 'tests/amazon_tests.robot'
  push:
    paths:
      - '**/*.robot'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.robot'
      - 'requirements.txt'

jobs:
  tests:
    name: E2E Testes - Robot Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Chrome and ChromeDriver
        run: |
          # Install Chrome 136
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable=136.0.6776.0-1
          sudo apt-mark hold google-chrome-stable
          
          # Install ChromeDriver 136
          wget -O chromedriver.zip https://chromedriver.storage.googleapis.com/136.0.6776.0/chromedriver_linux64.zip
          unzip chromedriver.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Robot Framework tests
        env:
          CI: true
        run: |
          mkdir -p reports
          TEST_PATH="${{ github.event.inputs.test_path }}"
          if [ -z "$TEST_PATH" ]; then TEST_PATH='tests/amazon_tests.robot'; fi
          ENVIRONMENT_INPUT="${{ github.event.inputs.environment }}"
          if [ -z "$ENVIRONMENT_INPUT" ]; then ENVIRONMENT_INPUT='dev'; fi
          xvfb-run -a python -m robot --variable ENVIRONMENT:$ENVIRONMENT_INPUT --outputdir reports "$TEST_PATH"

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: |
            reports/