name: E2E Testes - Robot Framework

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para os testes (dev/hom/prod)'
        required: false
        default: 'dev'
      test_path:
        description: 'Caminho/padrão dos testes Robot a executar'
        required: false
        default: 'tests/amazon_tests.robot'
  push:
    paths:
      - '**/*.robot'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.robot'
      - 'requirements.txt'

jobs:
  tests:
    name: E2E Testes - Robot Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget gnupg unzip curl

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Get Chrome version
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV

      - name: Install matching ChromeDriver
        run: |
          echo "Baixando ChromeDriver para a versão $CHROME_VERSION"
          CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_VERSION%.*}")
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade selenium==4.34.2

      - name: Run Robot Framework tests
        env:
          CI: true
        run: |
          mkdir -p reports
          TEST_PATH="${{ github.event.inputs.test_path }}"
          if [ -z "$TEST_PATH" ]; then TEST_PATH='tests/amazon_tests.robot'; fi
          ENVIRONMENT_INPUT="${{ github.event.inputs.environment }}"
          if [ -z "$ENVIRONMENT_INPUT" ]; then ENVIRONMENT_INPUT='dev'; fi
          xvfb-run -a python -m robot --variable ENVIRONMENT:$ENVIRONMENT_INPUT --outputdir reports "$TEST_PATH"

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: reports/
