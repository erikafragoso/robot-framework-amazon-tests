name: E2E Testes - Robot Framework

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para os testes (dev/hom/prod)'
        required: false
        default: 'dev'
      test_path:
        description: 'Caminho/padrão dos testes Robot a executar'
        required: false
        default: 'tests/amazon_tests.robot'
  push:
    paths:
      - '**/*.robot'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.robot'
      - 'requirements.txt'

jobs:
  tests:
    name: E2E Testes - Robot Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget gnupg unzip curl gnupg2

      - name: Install Google Chrome (latest)
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install matching ChromeDriver
        run: |
          python -m pip install --upgrade pip
          pip install webdriver-manager
          python - <<'PY'
import os
from webdriver_manager.chrome import ChromeDriverManager
path = ChromeDriverManager().install()
os.system(f"cp {path} /usr/local/bin/chromedriver && chmod +x /usr/local/bin/chromedriver")
PY
          chromedriver --version

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade selenium==4.34.2

      - name: Run Robot Framework tests
        env:
          CI: true
          SELENIUM_CHROME_ARGS: "--headless=new --no-sandbox --disable-dev-shm-usage --user-data-dir=/tmp/c
