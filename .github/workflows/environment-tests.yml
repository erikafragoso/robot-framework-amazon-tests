name: Environment Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - hom
        - prod

jobs:
  environment-tests:
    name: Tests for ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg2
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Install ChromeDriver
      run: |
        echo "Chrome version: $(google-chrome --version)"
        python -m pip install --user webdriver-manager
        CHROMEDRIVER_PATH=$(python -c "from webdriver_manager.chrome import ChromeDriverManager; print(ChromeDriverManager().install())")
        mkdir -p "$HOME/.local/bin"
        ln -sf "$CHROMEDRIVER_PATH" "$HOME/.local/bin/chromedriver"
        chmod +x "$HOME/.local/bin/chromedriver"
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        chromedriver --version
        
    - name: Run Tests for ${{ github.event.inputs.environment }}
      env:
        SELENIUM_CHROME_ARGS: "--headless=new --no-sandbox --disable-dev-shm-usage --user-data-dir=/tmp/chrome-profile"
      run: |
        mkdir -p results
        robot --outputdir results --timestampoutputs -v ENVIRONMENT:${{ github.event.inputs.environment }} tests/amazon_tests.robot
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ github.event.inputs.environment }}-test-results
        path: results/ 